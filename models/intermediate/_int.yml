version: 2

models:
  - name: int_pf_cells
    description: >
      Household (PF) credit summed to month x occupation x income band x product group. Numerators
      and denominators only; rates are computed in the marts from summed balances, never by
      averaging rates.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, occupation, income_band, product_group]
    columns:
      - name: occupation
        description: Nature of occupation from the Receita Federal registry (the cnae_ocupacao column for PF).
        data_tests:
          - not_null
      - name: income_band
        description: Monthly income in minimum wages as reported by the lender (the porte column for PF).
        data_tests:
          - not_null
      - name: product_group
        description: >
          From the pf_product_groups seed. A null here would mean a published product with no
          group, so this test is also the check that the mapping is complete.
        data_tests:
          - not_null
      - name: rows_with_count_withheld
        description: Published rows in the cell whose operation count BCB withholds (-1).

  - name: int_pf_cells_lagged
    description: >
      Household cells with their own balance 3 and 12 months earlier, for the lagged-denominator
      sensitivity (docs/analysis-design.md, section 2.2).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, occupation, income_band, product_group]

  - name: int_cross_section_pooled
    description: >
      Household balances pooled over each cross-section window by income band, occupation and
      product group, with all products and without rural credit.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [window_id, product_scope, income_band, occupation, product_group]
    columns:
      - name: product_scope
        data_tests:
          - accepted_values:
              arguments:
                values: [all_products, excluding_rural]

  - name: int_cross_section_by_mapping
    description: >
      Household balances pooled over each cross-section window by product group under the primary
      product mapping and the alternative one, for chart 4's crosswalk sensitivity. Rural scope
      follows the primary mapping in both.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [window_id, product_mapping, product_scope, income_band, occupation, product_group]
    columns:
      - name: product_mapping
        data_tests:
          - accepted_values:
              arguments:
                values: [primary, alternative]

  - name: int_gap_terms
    description: >
      The same-product and product-mix terms of each headline occupation pair's gap, per product
      group, income band, window, product scope and product mapping.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [pair_id, window_id, product_mapping, product_scope, income_band, product_group]

  - name: int_price_index
    description: >
      Consumer prices (IPCA, SGS 433) as an index equal to 1 in the latest SCR.data month, so a
      balance divided by it is in reais of that month.
    columns:
      - name: month
        data_tests:
          - unique
          - not_null
      - name: price_index
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
