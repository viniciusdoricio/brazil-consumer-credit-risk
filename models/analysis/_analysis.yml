version: 2

models:
  - name: analysis_grid
    description: >
      Chart 2, the grid. Household 90-day and 15-90-day rates by occupation and income band,
      pooled over each cross-section window, with the lagged-denominator rates and the cell's real
      growth within the window beside them.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [window_id, occupation, income_band]
    columns:
      - name: average_balance_bn
        description: Average monthly carteira_ativa over the window, in R$ billion.
      - name: d90_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: d15_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: d90_rate_lagged
        description: >
          90-day balance over the balance 12 months earlier. A seasoning sensitivity, not a
          measure: for income bands the lag crosses a January.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: d15_rate_lagged
        description: >
          15-90-day balance over the balance 3 months earlier. A seasoning sensitivity, not a
          measure: for the first three months of a calendar-year window the lag crosses a January.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: real_growth_within_window
        description: >
          The cell's balance in the window's last month over its first, in constant reais (IPCA),
          minus one. Within the window only, because band membership shifts every January: 11
          months of growth for a calendar year, 9 for March-December 2019.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
      - name: in_primary_grid
        description: True for named occupations in named income bands, the cells v1 compares.
      - name: below_minimum_size
        description: True when the average monthly balance is under var min_cell_balance_bn; the rates are not shown.

  - name: analysis_dispersion
    description: >
      Chart 3, which matters more. Per calendar year 2017-2024 and measure: the balance-weighted
      spread of occupation rates within income bands against the spread of income-band rates
      within occupations, next to unemployment. "primary" uses named occupations and bands only;
      "all" adds the residual categories.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, measure, variant]
    columns:
      - name: spread_across_occupations_within_bands
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: spread_across_bands_within_occupations
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: occupation_to_income_ratio
        description: Above 1 means occupation separates risk more than income does that year.
      - name: year_has_mid_year_income_event
        description: True when a non-January income reclassification falls inside the year (classification_events).

  - name: analysis_gap_decomposition
    description: >
      Chart 4, job or product. Each headline occupation pair's 90-day gap within a named income
      band, split exactly into a same-product gap and a product-mix gap, in every cross-section
      window, with all products and without rural credit.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pair_id, window_id, product_scope, income_band]
    columns:
      - name: gap
        description: rate_a minus rate_b, as a fraction.
        data_tests:
          - not_null
      - name: product_mix_share_of_gap
        description: >
          The product-mix gap as a share of the gap. Above one half, the gap is mostly about which
          products each occupation holds (docs/v1-decision.md, section 6). Null when the gap is
          under 0.1 pp, where a share of it means nothing.
      - name: gap_sign_holds_with_lag
        description: False when lagged denominators reverse the order of the two occupations.

  - name: analysis_shift_share
    description: >
      Chart 5, mix versus rate. The change in the national household 90-day or 15-90-day rate
      between two months, split exactly into pure rate, product mix and borrower (occupation) mix,
      for the fixed episodes, for the 15-90-day rate since January 2025, and for every month
      against a year earlier.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [comparison_id, measure, variant]
    columns:
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: [episode, year_over_year]
      - name: variant
        description: '"all" sums to the published total; "excluding_residual" drops the occupation "Outros".'
        data_tests:
          - accepted_values:
              arguments:
                values: [all, excluding_residual]
      - name: spans_occupation_reclassification
        description: >
          True when an occupation reclassification falls between the two months, so part of the
          borrower-mix term is classification rather than lending.

  - name: analysis_current_read
    description: >
      Chart 6, the current read. Each occupation's 15-90-day rate over the last 12 months against
      calendar 2024, with lagged denominators, next to its real portfolio growth.
    columns:
      - name: occupation
        data_tests:
          - unique
          - not_null
      - name: months_2024
        data_tests:
          - accepted_values:
              arguments:
                values: [12]
                quote: false
      - name: months_last_12
        data_tests:
          - accepted_values:
              arguments:
                values: [12]
                quote: false
      - name: d15_rate_last_12_months
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: real_balance_growth
        description: Average real balance over the last 12 months against 2024, minus one.
        data_tests:
          - not_null
      - name: possible_tightening
        description: True when the rate fell while the real portfolio shrank; not read as borrowers improving.
