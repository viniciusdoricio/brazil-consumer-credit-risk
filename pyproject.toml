[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[project]
name = "brazil-consumer-credit-risk"
version = "0.1.0"
description = "Consumer credit risk in Brazil from Banco Central public data (SCR.data, SGS)"
# dbt-core 1.11 supports Python up to 3.13
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "requests>=2.32",
    # 1.12 depends on dbt-core-experimental-parser, whose build downloads a binary
    # at install time; stay on 1.11 until that is a normal wheel
    "dbt-core>=1.11,<1.12",
    "dbt-duckdb>=1.11,<1.12",
]

[project.scripts]
fetch-data = "brazil_consumer_credit_risk.fetch:main"
make-charts = "brazil_consumer_credit_risk.charts.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
    # what Quarto needs to run the write-up's Python cells in this environment
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# Recon scripts embed long SQL strings; wrapping them hurts readability more than it helps.
"scripts/recon/*" = ["E501"]
