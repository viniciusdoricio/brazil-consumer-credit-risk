[project]
name = "br-credit-monitor"
version = "0.1.0"
description = "Credit portfolio monitoring on Brazilian public data (BCB SCR.data + SGS)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "requests>=2.32",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
